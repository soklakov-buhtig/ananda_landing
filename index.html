<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт в разработке</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); text-align: center; max-width: 480px; width: 100%; border: 1px solid #334155; }
        h1 { font-size: 28px; margin-bottom: 16px; color: #38bdf8; }
        p { font-size: 16px; color: #94a3b8; margin-bottom: 32px; line-height: 1.6; }
        .btn { display: inline-block; background: #38bdf8; color: #0f172a; padding: 14px 28px; border-radius: 8px; font-weight: bold; text-decoration: none; transition: all 0.2s ease; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3); }
        .btn:hover { background: #0ea5e9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Сайт в разработке 🚀</h1>
        <p>Совсем скоро здесь появится полноценный лендинг с описанием моих услуг, кейсами и тарифами. А пока вы можете связаться со мной напрямую!</p>
        <!-- Замените ССЫЛКА_НА_ТЕЛЕГРАМ на вашу реальную ссылку, например https://t.me -->
        <a href="ССЫЛКА_НА_ТЕЛЕГРАМ" class="btn" target="_blank">Написать в Telegram</a>
    </div>
</body>
</html>
