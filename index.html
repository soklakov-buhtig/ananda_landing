<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananda — Онлайн-работа с телом</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fcfbfa; color: #2d3748; line-height: 1.6; }
        
        /* Главный экран */
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient(circle at top right, #f3f4ed 0%, #fcfbfa 60%); }
        .container { max-width: 650px; width: 100%; text-align: center; }
        
        /* Надзаголовок */
        .badge { display: inline-block; background-color: #e2e8f0; color: #4a5568; padding: 6px 16px; border-radius: 50px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
        
        /* Заголовок и подзаголовок */
        h1 { font-size: 42px; line-height: 1.2; color: #1a202c; margin-bottom: 20px; font-weight: 700; }
        h1 span { color: #2f5d47; }
        p.subtitle { font-size: 18px; color: #718096; margin-bottom: 40px; }
        
        /* Кнопка */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background-color: #2f5d47; color: #ffffff; padding: 18px 36px; border-radius: 12px; font-size: 16px; font-weight: bold; text-decoration: none; transition: all 0.2s ease-in-out; box-shadow: 0 4px 14px rgba(47, 93, 71, 0.25); }
        .btn:hover { background-color: #234735; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(47, 93, 71, 0.35); }
        .btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        /* Адаптивность для телефонов */
        @media (max-width: 480px) {
            h1 { font-size: 32px; }
            p.subtitle { font-size: 16px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="container">
            <div class="badge">Индивидуальный формат онлайн</div>
            <h1>Свобода и легкость вашего <span>тела через экран</span></h1>
            <p class="subtitle">Персональная онлайн-система тренировок и оздоровления. Избавляемся от зажимов, восстанавливаем баланс и возвращаем энергию без изнуряющих нагрузок.</p>
            
            <a href="https://t.me" class="btn" target="_blank">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-1-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.66-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.35-.49.96-.75 3.78-1.65 6.31-2.74 7.58-3.27 3.61-1.51 4.36-1.78 4.85-1.79.11 0 .35.03.5.16.13.12.17.28.19.39.02.07.03.22.02.39z"/>
                </svg>
                Записаться на разбор тела
            </a>
        </div>
    </section>

</body>
</html>
